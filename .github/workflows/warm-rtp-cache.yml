name: warm-rtp-cache

# Fires in three cases:
#   1. workflow_dispatch       — manual run from the Actions tab.
#   2. push to rtp-samples.txt — the URL list itself changed.
#   3. workflow_run            — chained after a successful "Deploy WASM
#                                demo" so freshly-deployed assets get
#                                warmed without a separate trigger.
on:
  workflow_dispatch:
  push:
    paths: [.github/deploy/rtp-samples.txt]
  workflow_run:
    workflows: ["Deploy WASM demo"]
    types: [completed]

jobs:
  warm:
    runs-on: ubuntu-latest
    # On a workflow_run trigger only proceed if the upstream deploy succeeded.
    # Other triggers (manual / push) bypass this guard.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
      - name: Warm each URL listed in rtp-samples.txt
        # R2 answers with `Vary: Origin`, so the edge keeps one cache entry
        # per Origin.  Browsers always send Origin on these cross-origin
        # fetches, so warm the entry the demo actually hits; a request
        # without Origin only fills an entry no browser ever reads.
        # Leave out clips over the 512 MB cacheable-file limit: the edge
        # answers them with BYPASS, so warming one only downloads it.
        env:
          WARM_ORIGIN: https://htj2k.osamu620.dev
        run: |
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            echo "→ $url"
            curl -sS -o /dev/null -D - --max-time 300 -H "Origin: $WARM_ORIGIN" "$url" \
              | grep -iE 'cf-ray|cf-cache-status|access-control-allow-origin'
          done < .github/deploy/rtp-samples.txt
