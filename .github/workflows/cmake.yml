# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Set up a matrix to run the following 3 configurations:
      # 1. <Windows, Release, latest MSVC compiler toolchain on the default runner image, default generator>
      # 2. <Linux, Release, latest GCC compiler toolchain on the default runner image, default generator>
      # 3. <Linux, Release, latest Clang compiler toolchain on the default runner image, default generator>
      # 4. <macOS, Release, clang>
      #
      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel, ubuntu-24.04-arm, windows-11-arm]
#        os: [ubuntu-latest, macos-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-11-arm
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: ubuntu-24.04-arm
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-24.04-arm
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
          - os: macos-15-intel
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: windows-11-arm
            c_compiler: gcc
          - os: windows-11-arm
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          - os: macos-15-intel
            c_compiler: gcc
          - os: macos-15-intel
            c_compiler: cl
          - os: ubuntu-24.04-arm
            c_compiler: cl

    steps:
      - uses: actions/checkout@v5

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Configure CMake on Windows
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        if: runner.os == 'Windows'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}
        #  -A "x64"
          
      - name: Configure CMake on Linux or macOS
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        if: runner.os != 'Windows'
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -S ${{ github.workspace }}

      - name: Build
        # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        run: ctest --build-config ${{ matrix.build_type }} -VV

  ubsan:
    # Run the test suite under UndefinedBehaviorSanitizer, with and without the
    # SIMD code paths, and fail on any report -- including reports from tests
    # that are expected to fail, which ctest alone would not catch.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        simd: [ON, OFF]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_AVX2=${{ matrix.simd }}
          "-DCMAKE_CXX_FLAGS=-fsanitize=undefined -fno-omit-frame-pointer -g"
          "-DCMAKE_C_FLAGS=-fsanitize=undefined -g"
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=undefined
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=undefined

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Test
        working-directory: build
        env:
          UBSAN_OPTIONS: print_stacktrace=1:log_path=${{ github.workspace }}/ubsan/ub
        run: |
          mkdir -p "${{ github.workspace }}/ubsan"
          ctest -j$(nproc) --output-on-failure

      - name: Check for UBSan reports
        if: always()
        shell: bash
        run: |
          if grep -rh 'runtime error' ubsan/ 2>/dev/null | sort | uniq -c | sort -rn | head -50 | grep .; then
            exit 1
          fi
          echo "no UBSan reports"

  portable-x86:
    # Distributable x86-64 builds (no -march=native).  Besides running the
    # tests, check that the library has no instructions above the requested
    # level, so it runs on any CPU of that level.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_cpu: [x86-64-v3, generic]
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENHTJ2K_TARGET_CPU=${{ matrix.target_cpu }}

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Check instruction set
        shell: bash
        run: |
          lib=$(ls build/bin/libopenhtj2k.so.*.*.* | head -1)
          objdump -d --no-show-raw-insn "$lib" > disasm.txt
          if [ "${{ matrix.target_cpu }}" = generic ]; then
            # any VEX/EVEX-encoded instruction (AVX and up)
            pattern='^\s+[0-9a-f]+:\s+v[a-z0-9]+'
          else
            # AVX-512: zmm, mask and upper-16 vector registers, EVEX-only ops
            pattern='%zmm|%k[0-7]|%[xy]mm(1[6-9]|2[0-9]|3[01])\b|vpternlog|vpermt2|vpermi2|vpcompress|vpexpand'
          fi
          n=$(grep -cE "$pattern" disasm.txt || true)
          echo "instructions above ${{ matrix.target_cpu }} in $lib: $n"
          test "$n" -eq 0

      - name: Test
        working-directory: build
        run: ctest -j$(nproc) --output-on-failure

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v16

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build WASM (scalar + SIMD)
        run: |
          emcmake cmake -B web/build -S web
          cmake --build web/build -j$(nproc)

      - name: Build native (imgcmp + decoder for comparison tests)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Test WASM conformance
        working-directory: build
        run: ctest -R wasm_ -VV
